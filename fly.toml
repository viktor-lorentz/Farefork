app = "farefork-api"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  GEO_USER_AGENT = "Farefork/0.1 (+https://github.com/viktor-lorentz/Farefork)"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
